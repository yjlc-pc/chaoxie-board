name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查关键文件
        run: |
          test -f index.html
          test -f vendor/transformers/transformers.web.min.js || { echo "缺少 vendor/transformers，先本地执行 vendor 步骤"; exit 1; }
          test -f data/strokes.json

      - name: 清理本地残留
        run: rm -rf .chrome-profile .chrome-headless testdata

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
